services:
  db:
    # Usa a imagem oficial do PostgreSQL
    image: postgres:16-alpine

    # Nome do contêiner para facilitar a referência
    container_name: shortfy-database
    restart: unless-stopped

    # Variáveis de ambiente para configurar o banco de dados
    environment:
      POSTGRES_USER: shortfy
      POSTGRES_PASSWORD: shortfy123
      POSTGRES_DB: shortfy_db

    ports:
      - "5432:5432"

    # Declarar volumes para persistencia do db
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortfy -d shortfy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
